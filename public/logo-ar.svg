<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Decorative background circle -->
  <circle cx="100" cy="100" r="95" stroke="#1E40AF" stroke-width="1.5" opacity="0.15"/>

  <g transform="translate(100, 100)">
    <!-- Newspaper/Scroll rolled (representing news) -->
    <g transform="translate(-25, -15)">
      <!-- Outer scroll -->
      <path d="M 0 0 L 40 0 Q 45 0 45 5 L 45 30 Q 45 35 40 35 L 0 35 Q -5 35 -5 30 L -5 5 Q -5 0 0 0"
            fill="none" stroke="#1E40AF" stroke-width="3"/>

      <!-- Inner scroll detail -->
      <line x1="8" y1="8" x2="37" y2="8" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
      <line x1="8" y1="16" x2="37" y2="16" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
      <line x1="8" y1="24" x2="30" y2="24" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>

      <!-- Rolled ends (top) -->
      <circle cx="0" cy="0" r="3" fill="#1E40AF"/>
      <circle cx="40" cy="0" r="3" fill="#1E40AF"/>
    </g>

    <!-- Academic cap element (mortarboard) -->
    <g transform="translate(15, -28)">
      <!-- Cap top -->
      <ellipse cx="0" cy="0" rx="12" ry="3" fill="#7C3AED" opacity="0.8"/>

      <!-- Cap front -->
      <path d="M -10 0 L 10 0 L 8 8 L -8 8 Q -10 6 -10 0" fill="#7C3AED" opacity="0.6"/>

      <!-- Tassel -->
      <line x1="0" y1="8" x2="0" y2="16" stroke="#1E40AF" stroke-width="2"/>
      <circle cx="0" cy="18" r="2" fill="#1E40AF"/>
    </g>

    <!-- Speech bubble (voice element) -->
    <g transform="translate(20, 8)">
      <!-- Bubble -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="#1E40AF" stroke-width="2.5"/>

      <!-- Tail -->
      <path d="M -8 12 L -12 20 L -5 14" fill="#1E40AF"/>

      <!-- Inner dot (representing speech) -->
      <circle cx="0" cy="0" r="3" fill="#7C3AED"/>
    </g>

    <!-- Decorative stars (representing excellence/achievement) -->
    <g opacity="0.6">
      <circle cx="-35" cy="-20" r="2" fill="#7C3AED"/>
      <circle cx="35" cy="25" r="2" fill="#1E40AF"/>
      <circle cx="-20" cy="35" r="1.5" fill="#7C3AED"/>
    </g>
  </g>
</svg>