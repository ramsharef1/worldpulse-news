<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Decorative background circle -->
  <circle cx="100" cy="100" r="95" stroke="#1E40AF" stroke-width="1.5" opacity="0.15"/>

  <g transform="translate(100, 100)">
    <!-- Newspaper (left side) -->
    <g transform="translate(-30, -15)">
      <!-- Newspaper frame -->
      <rect x="0" y="0" width="35" height="45" rx="2" fill="none" stroke="#1E40AF" stroke-width="2.5"/>

      <!-- Headlines (wavy lines representing text) -->
      <line x1="5" y1="8" x2="30" y2="8" stroke="#7C3AED" stroke-width="2"/>
      <line x1="5" y1="16" x2="25" y2="16" stroke="#1E40AF" stroke-width="1.5" opacity="0.7"/>
      <line x1="5" y1="24" x2="28" y2="24" stroke="#1E40AF" stroke-width="1.5" opacity="0.7"/>
      <line x1="5" y1="32" x2="22" y2="32" stroke="#1E40AF" stroke-width="1.5" opacity="0.7"/>
      <line x1="5" y1="40" x2="25" y2="40" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Speech bubble/megaphone (right side - representing voice) -->
    <g transform="translate(15, -8)">
      <!-- Bubble outline -->
      <path d="M -10 -8 L 12 -8 Q 14 -8 14 -6 L 14 10 Q 14 12 12 12 L 2 12 L 8 18 L 0 12 L -10 12 Q -12 12 -12 10 L -12 -6 Q -12 -8 -10 -8"
            fill="none" stroke="#1E40AF" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Motion lines (representing sound/broadcast) -->
      <path d="M -18 -5 Q -22 -2 -20 2" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M -18 5 Q -23 8 -20 12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

      <!-- Center dot -->
      <circle cx="2" cy="2" r="2.5" fill="#7C3AED"/>
    </g>

    <!-- University cap (top right) -->
    <g transform="translate(28, -30)">
      <!-- Mortarboard -->
      <ellipse cx="0" cy="0" rx="10" ry="2.5" fill="#7C3AED" opacity="0.8"/>

      <!-- Front of cap -->
      <path d="M -8 0 L 8 0 L 6 6 L -6 6 Q -8 5 -8 0" fill="#7C3AED" opacity="0.6"/>

      <!-- Tassel -->
      <line x1="0" y1="6" x2="0" y2="12" stroke="#1E40AF" stroke-width="1.5"/>
      <circle cx="0" cy="13" r="1.5" fill="#1E40AF"/>
    </g>

    <!-- Accent elements -->
    <g opacity="0.5">
      <!-- Corner accents -->
      <line x1="-45" y1="-45" x2="-35" y2="-35" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="35" y1="35" x2="45" y2="45" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>