<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background for icon context -->
  <circle cx="100" cy="100" r="95" stroke="url(#logoGradient)" stroke-width="2" opacity="0.1"/>

  <!-- Open book shape (left and right pages) -->
  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M -35 -45 L -8 -45 L -8 45 L -35 50 Q -40 45 -40 35 L -40 -35 Q -40 -45 -35 -45"
          fill="url(#logoGradient)" opacity="0.9"/>

    <!-- Right page -->
    <path d="M 8 -45 L 35 -45 Q 40 -45 40 -35 L 40 35 Q 40 45 35 50 L 8 45 L 8 -45"
          fill="url(#logoGradient)" opacity="0.7"/>

    <!-- Voice/Sound waves emanating from center (right side) -->
    <!-- Wave 1 (closest) -->
    <path d="M 20 -20 Q 35 -28 45 -20"
          stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>

    <!-- Wave 2 (middle) -->
    <path d="M 15 0 Q 38 -10 55 0"
          stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Wave 3 (outer) -->
    <path d="M 20 20 Q 35 28 45 20"
          stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Center accent dot (speech point) -->
    <circle cx="8" cy="0" r="4" fill="url(#logoGradient)"/>
  </g>
</svg>