<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background circle - subtle -->
  <circle cx="100" cy="100" r="95" stroke="#1E40AF" stroke-width="1" opacity="0.1"/>

  <g transform="translate(100, 100)">
    <!-- MAIN: Large newspaper (prominent) -->
    <g transform="translate(-32, -15)">
      <!-- Newspaper frame - bold -->
      <rect x="0" y="0" width="42" height="50" rx="2" fill="none" stroke="#1E40AF" stroke-width="3.5"/>

      <!-- Main headline bar - bold, teal colored -->
      <line x1="6" y1="10" x2="36" y2="10" stroke="#1AA89D" stroke-width="4" stroke-linecap="round"/>

      <!-- Secondary headlines -->
      <line x1="6" y1="20" x2="34" y2="20" stroke="#1E40AF" stroke-width="2.5" opacity="0.8"/>
      <line x1="6" y1="28" x2="30" y2="28" stroke="#1E40AF" stroke-width="2.5" opacity="0.7"/>

      <!-- Body text lines -->
      <line x1="6" y1="36" x2="36" y2="36" stroke="#1E40AF" stroke-width="1.5" opacity="0.5"/>
      <line x1="6" y1="42" x2="28" y2="42" stroke="#1E40AF" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- University cap (accent element) -->
    <g transform="translate(28, -32)">
      <!-- Mortarboard - teal accent -->
      <ellipse cx="0" cy="0" rx="8" ry="2.2" fill="#1AA89D" opacity="0.7"/>
      <!-- Front of cap -->
      <path d="M -6 0 L 6 0 L 5 5 L -5 5 Q -6 4 -6 0" fill="#1AA89D" opacity="0.5"/>
      <!-- Tassel -->
      <line x1="0" y1="5" x2="0" y2="10" stroke="#1AA89D" stroke-width="1.5"/>
    </g>

    <!-- Voice/broadcast element (simplified wave) -->
    <g transform="translate(-22, 8)">
      <!-- Radio wave lines (simplified) -->
      <path d="M -2 -6 Q 2 -10 6 -6" fill="none" stroke="#1AA89D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -6 0 Q 0 -4 6 0" fill="none" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

      <!-- Center dot -->
      <circle cx="0" cy="0" r="2" fill="#1AA89D"/>
    </g>

    <!-- Accent corner elements (minimalist) -->
    <g opacity="0.3">
      <line x1="-48" y1="-48" x2="-40" y2="-40" stroke="#1AA89D" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="40" x2="48" y2="48" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- English Typography -->
    <text x="0" y="50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle" dominant-baseline="middle">
      Universities
    </text>
    <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#1AA89D" text-anchor="middle" dominant-baseline="middle">
      Voice
    </text>
  </g>
</svg>