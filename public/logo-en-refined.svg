<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- ENGLISH LOGO MARKER: Left-facing rectangle newspaper -->
  <circle cx="100" cy="100" r="95" stroke="#1E40AF" stroke-width="1" opacity="0.1"/>

  <g transform="translate(100, 100)">
    <!-- Clean rectangular newspaper - LTR left-aligned appearance -->
    <g transform="translate(-30, -18)">
      <rect x="0" y="0" width="45" height="52" rx="2.5" fill="none" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Bold headline - TEAL for English -->
      <line x1="8" y1="12" x2="42" y2="12" stroke="#1AA89D" stroke-width="4" stroke-linecap="round"/>

      <!-- Content structure -->
      <line x1="8" y1="23" x2="40" y2="23" stroke="#1E40AF" stroke-width="2.5" opacity="0.8"/>
      <line x1="8" y1="32" x2="35" y2="32" stroke="#1E40AF" stroke-width="2.5" opacity="0.7"/>
      <line x1="8" y1="40" x2="42" y2="40" stroke="#1AA89D" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="48" x2="30" y2="48" stroke="#1E40AF" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Academic cap - marks it as educational -->
    <g transform="translate(25, -38)">
      <ellipse cx="0" cy="0" rx="11" ry="2.5" fill="#1AA89D" opacity="0.7"/>
      <path d="M -9 0 L 9 0 L 8 7 L -8 7 Q -9 5 -9 0" fill="#1AA89D" opacity="0.5"/>
      <!-- Tassel for emphasis -->
      <line x1="0" y1="7" x2="0" y2="13" stroke="#1AA89D" stroke-width="1.5"/>
    </g>

    <!-- Radio broadcast waves - THREE ARCS for English -->
    <g transform="translate(-24, 10)">
      <path d="M -3 -5 Q 2 -12 7 -5" fill="none" stroke="#1AA89D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -8 0 Q 0 -8 8 0" fill="none" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="#1AA89D"/>
    </g>

    <!-- Geometric corner accents - marks it as modern/English -->
    <g opacity="0.35">
      <line x1="-42" y1="-45" x2="-35" y2="-38" stroke="#1AA89D" stroke-width="2" stroke-linecap="round"/>
      <line x1="35" y1="38" x2="42" y2="45" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>