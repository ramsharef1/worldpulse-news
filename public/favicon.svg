<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="200" height="200" fill="#1E40AF" rx="40"/>
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M -35 -45 L -8 -45 L -8 45 L -35 50 Q -40 45 -40 35 L -40 -35 Q -40 -45 -35 -45"
          fill="url(#faviconGradient)" opacity="0.95"/>

    <!-- Right page -->
    <path d="M 8 -45 L 35 -45 Q 40 -45 40 -35 L 40 35 Q 40 45 35 50 L 8 45 L 8 -45"
          fill="url(#faviconGradient)" opacity="0.75"/>

    <!-- Voice waves -->
    <path d="M 20 -20 Q 35 -28 45 -20"
          stroke="url(#faviconGradient)" stroke-width="3" stroke-linecap="round"/>

    <path d="M 15 0 Q 38 -10 55 0"
          stroke="url(#faviconGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <path d="M 20 20 Q 35 28 45 20"
          stroke="url(#faviconGradient)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Center dot -->
    <circle cx="8" cy="0" r="4" fill="url(#faviconGradient)"/>
  </g>
</svg>